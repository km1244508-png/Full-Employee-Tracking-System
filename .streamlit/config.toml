[theme]
primaryColor = "#6366F1"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#141B2D"
textColor = "#F1F5F9"
font = "sans serif"

[client]
showErrorDetails = false
toolbarMode = "minimal"

[logger]
level = "warning"

[server]
maxUploadSize = 200
enableXsrfProtection = false
enableCORS = true

[browser]
gatherUsageStats = false
# serverAddress will be set by Streamlit Cloud automatically
